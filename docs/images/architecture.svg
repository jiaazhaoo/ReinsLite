<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, 'Segoe UI', Inter, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a877e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 650; fill: #1f1e1c; }
      .s { font-size: 12.5px; fill: #6b6963; }
      .z { font-size: 12px; fill: #9a978e; }
      .l { stroke: #8a877e; stroke-width: 1.4; fill: none; }
      .d { stroke: #8a877e; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
      .lab { font-size: 11.5px; fill: #8a877e; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="700" rx="18" fill="#faf9f6"/>

  <!-- sessions -->
  <text x="40" y="44" class="z">SESSIONS · 会话（Claude Code）</text>
  <g>
    <rect x="40" y="58" width="250" height="70" rx="12" fill="#fff" stroke="#e7e5dd"/>
    <text x="60" y="88" class="t">Develop · 开发会话</text><text x="60" y="110" class="s">one candidate version each</text>
    <rect x="315" y="58" width="250" height="70" rx="12" fill="#fff" stroke="#e7e5dd"/>
    <text x="335" y="88" class="t">Run · 运行会话</text><text x="335" y="110" class="s">owns its batches</text>
    <rect x="590" y="58" width="250" height="70" rx="12" fill="#fff" stroke="#e7e5dd"/>
    <text x="610" y="88" class="t">Analysis · 分析会话</text><text x="610" y="110" class="s">read-only</text>
  </g>
  <rect x="880" y="58" width="280" height="70" rx="12" fill="#f6e9e3" stroke="#e8c3b3"/>
  <text x="900" y="88" class="t" style="fill:#9c4527">Hook · 钩子</text>
  <text x="900" y="110" class="s">blocks anything that goes around reins</text>

  <path d="M165 128 V176" class="l" marker-end="url(#a)"/><path d="M440 128 V176" class="l" marker-end="url(#a)"/><path d="M715 128 V176" class="l" marker-end="url(#a)"/>
  <text x="456" y="160" class="lab">propose · 提议</text>
  <path d="M1020 128 V160 H860 V176" class="d" marker-end="url(#a)"/>

  <!-- reins core -->
  <rect x="40" y="180" width="1120" height="300" rx="16" fill="#fff" stroke="#d6d3c9"/>
  <text x="62" y="210" class="t">reins · decides and records · 决定并记录</text>
  <text x="62" y="230" class="s">every development and every run is registered, with the session it came from</text>

  <rect x="470" y="250" width="260" height="96" rx="12" fill="#1f1e1c"/>
  <text x="490" y="282" class="t" style="fill:#faf9f6">Registry · 登记库</text>
  <text x="490" y="304" class="s" style="fill:#c9c6bc">SQLite, append-only events</text>
  <text x="490" y="324" class="s" style="fill:#c9c6bc">cases · batches · versions · spend</text>

  <rect x="62" y="250" width="370" height="96" rx="12" fill="#f4f3ee" stroke="#e7e5dd"/>
  <text x="82" y="280" class="t">Development · 开发</text>
  <text x="82" y="302" class="s">candidate worktree → gate on a frozen benchmark</text>
  <text x="82" y="322" class="s">→ merge → release · versions of code, prompts,</text>
  <text x="82" y="340" class="s">models, weights, tools, workflows</text>

  <rect x="768" y="250" width="370" height="96" rx="12" fill="#f4f3ee" stroke="#e7e5dd"/>
  <text x="788" y="280" class="t">Runs · 运行</text>
  <text x="788" y="302" class="s">batches over a fixed case set · per-case ledger</text>
  <text x="788" y="322" class="s">only `reins run` starts a pipeline · pause /</text>
  <text x="788" y="340" class="s">resume / retry · issues hand problems over</text>

  <path d="M432 298 H466" class="l" marker-end="url(#a)"/><path d="M768 298 H734" class="l" marker-end="url(#a)"/>

  <rect x="62" y="366" width="250" height="96" rx="12" fill="#e5f2ea" stroke="#bfdccb"/>
  <text x="82" y="396" class="t" style="fill:#2f7d57">Gateway · 网关</text>
  <text x="82" y="418" class="s">holds every key · cache</text>
  <text x="82" y="438" class="s">reserve → settle · budget pool</text>

  <rect x="334" y="366" width="250" height="96" rx="12" fill="#f8eedb" stroke="#ead3a6"/>
  <text x="354" y="396" class="t" style="fill:#a86b12">Watchdog · 看门狗</text>
  <text x="354" y="418" class="s">stalls, late cases, lost processes</text>
  <text x="354" y="438" class="s">disk / memory / GPU · balances</text>

  <rect x="616" y="366" width="250" height="96" rx="12" fill="#e5edfa" stroke="#bccdeb"/>
  <text x="636" y="396" class="t" style="fill:#2f62c4">Board · 看板</text>
  <text x="636" y="418" class="s">pipeline map · runs · dev</text>
  <text x="636" y="438" class="s">cost · toolbox (read-only)</text>

  <rect x="888" y="366" width="250" height="96" rx="12" fill="#eee8f8" stroke="#d3c6ee"/>
  <text x="908" y="396" class="t" style="fill:#6e4fb5">Gate · 门禁</text>
  <text x="908" y="418" class="s">missed errors may not rise</text>
  <text x="908" y="438" class="s">review load is a cost</text>

  <path d="M600 346 V362" class="l"/>

  <!-- below -->
  <path d="M187 462 V540" class="l" marker-end="url(#a)"/>
  <text x="200" y="510" class="lab">paid calls · 付费调用</text>
  <rect x="62" y="544" width="250" height="110" rx="12" fill="#fff" stroke="#e7e5dd"/>
  <text x="82" y="574" class="t">Providers · 服务商</text>
  <text x="82" y="596" class="s">presets + config.toml</text>
  <text x="82" y="616" class="s">OpenRouter · DeepSeek · OpenAI</text>
  <text x="82" y="636" class="s">Google Maps · your own</text>

  <path d="M600 480 V540" class="d" marker-end="url(#a)"/>
  <text x="612" y="510" class="lab">declares · 声明</text>
  <rect x="334" y="544" width="532" height="110" rx="12" fill="#fff" stroke="#e7e5dd"/>
  <text x="354" y="574" class="t">Your project · 你的项目（reins.toml）</text>
  <text x="354" y="596" class="s">case key and pattern · batch scope · modules and files · gate command</text>
  <text x="354" y="616" class="s">pipeline programs and stages · prompts / models / weights / tools</text>
  <text x="354" y="636" class="s">workflows · glossary · delivery rules</text>

  <rect x="888" y="544" width="250" height="110" rx="12" fill="#fff" stroke="#e7e5dd"/>
  <text x="908" y="574" class="t">This machine · 本机</text>
  <text x="908" y="596" class="s">settings.toml: home, code root</text>
  <text x="908" y="616" class="s">config.toml: pool, providers,</text>
  <text x="908" y="636" class="s">frozen paths · secrets/*.key</text>
</svg>
