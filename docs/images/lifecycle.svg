<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="-apple-system, 'Segoe UI', Inter, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a877e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 14.5px; font-weight: 650; fill: #1f1e1c; }
      .c { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; fill: #9c4527; }
      .s { font-size: 12px; fill: #6b6963; }
      .h { font-size: 12px; fill: #9a978e; letter-spacing: .06em; }
      .l { stroke: #8a877e; stroke-width: 1.4; fill: none; }
      .d { stroke: #c96442; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="#faf9f6"/>

  <text x="40" y="42" class="h">DEVELOP · 开发</text>
  <text x="640" y="42" class="h">RUN · 运行</text>

  <g>
    <rect x="40" y="58" width="170" height="104" rx="12" fill="#fff" stroke="#e7e5dd"/>
    <text x="58" y="86" class="t">1 Start</text><text x="58" y="106" class="c">reins dev start</text>
    <text x="58" y="128" class="s">own worktree,</text><text x="58" y="146" class="s">named version</text>

    <rect x="240" y="58" width="170" height="104" rx="12" fill="#fff" stroke="#e7e5dd"/>
    <text x="258" y="86" class="t">2 Gate · 门禁</text><text x="258" y="106" class="c">frozen benchmark</text>
    <text x="258" y="128" class="s">missed errors</text><text x="258" y="146" class="s">may not rise</text>

    <rect x="440" y="58" width="170" height="104" rx="12" fill="#fff" stroke="#e7e5dd"/>
    <text x="458" y="86" class="t">3 Finish</text><text x="458" y="106" class="c">reins dev finish</text>
    <text x="458" y="128" class="s">merge · release · pin</text><text x="458" y="146" class="s">refreeze workflow</text>

    <rect x="640" y="58" width="170" height="104" rx="12" fill="#fff" stroke="#e7e5dd"/>
    <text x="658" y="86" class="t">4 Open · 开批次</text><text x="658" y="106" class="c">reins batch open</text>
    <text x="658" y="128" class="s">fixed case set,</text><text x="658" y="146" class="s">release, workflow</text>

    <rect x="840" y="58" width="150" height="104" rx="12" fill="#fff" stroke="#e7e5dd"/>
    <text x="858" y="86" class="t">5 Approve</text><text x="858" y="106" class="c">--cap USD</text>
    <text x="858" y="128" class="s">the user signs</text><text x="858" y="146" class="s">the money</text>

    <rect x="1020" y="58" width="140" height="104" rx="12" fill="#fff" stroke="#e7e5dd"/>
    <text x="1038" y="86" class="t">6 Run</text><text x="1038" y="106" class="c">reins run</text>
    <text x="1038" y="128" class="s">ledger, gateway,</text><text x="1038" y="146" class="s">watchdog</text>
  </g>
  <path d="M210 110 H236" class="l" marker-end="url(#a)"/><path d="M410 110 H436" class="l" marker-end="url(#a)"/>
  <path d="M610 110 H636" class="l" marker-end="url(#a)"/><path d="M810 110 H836" class="l" marker-end="url(#a)"/>
  <path d="M990 110 H1016" class="l" marker-end="url(#a)"/>

  <!-- issue loop -->
  <path d="M1090 162 V230 H760" class="d" marker-end="url(#a)"/>
  <rect x="560" y="200" width="196" height="64" rx="12" fill="#f6e9e3" stroke="#e8c3b3"/>
  <text x="578" y="226" class="t" style="fill:#9c4527">Issue · 问题单</text>
  <text x="578" y="248" class="c">reins issue open</text>
  <path d="M560 232 H125 V166" class="d" marker-end="url(#a)"/>
  <text x="140" y="222" class="s">another session fixes it (dev start --issue N) · 另一会话修复</text>
  <text x="790" y="220" class="s">a run finds wrong cases · 运行发现问题</text>
  <text x="140" y="256" class="s">finish tells the opener → reins issue verify · 通知开单方确认</text>

  <!-- delivery -->
  <rect x="640" y="300" width="250" height="90" rx="12" fill="#e5f2ea" stroke="#bfdccb"/>
  <text x="658" y="328" class="t" style="fill:#2f7d57">7 Accept · 验收</text>
  <text x="658" y="348" class="c">reins accept</text>
  <text x="658" y="370" class="s">fixed-seed sample, error budget</text>
  <rect x="910" y="300" width="250" height="90" rx="12" fill="#e5f2ea" stroke="#bfdccb"/>
  <text x="928" y="328" class="t" style="fill:#2f7d57">8 Deliver · 交付</text>
  <text x="928" y="348" class="c">reins deliver</text>
  <text x="928" y="370" class="s">contract check, frozen copy</text>
  <path d="M1110 162 V280 H765 V296" class="l" marker-end="url(#a)"/>
  <path d="M890 345 H906" class="l" marker-end="url(#a)"/>

  <text x="40" y="330" class="h">EVERY STEP IS RECORDED · 每一步都有记录</text>
  <text x="40" y="354" class="s">who (session), what (version), on which cases,</text>
  <text x="40" y="374" class="s">at what cost, with which evidence</text>
</svg>
