[[preflight]]
name = "eval_dir_inputs"
cmd = "test -s $REINS_WORK_DIR/records.json && test -s $REINS_WORK_DIR/cases.json && test -s $REINS_WORK_DIR/config.json && test -s $REINS_WORK_DIR/truth.gpkg && echo inputs present"

[[preflight]]
name = "case_set_is_records"
cmd = "python3 $REINS_ADAPTER/stage_hook.py check-cases $REINS_WORK_DIR $REINS_CASES"

[[preflight]]
name = "case_names"
# decision #141 (user 2026-11-24: 完全全面禁止这种编号): every case folder = its record's three fields
# (council~oachargeid~further-information-reference, e2e case_names.case_folder); a council prefix is refused
cmd = "python3 $REINS_ADAPTER/stage_hook.py check-names $REINS_WORK_DIR"

[[preflight]]
name = "file_links"
# user 2026-10-23: the default input carries file_link (the charge's cloud scans) and the Evidence sheet shows it;
# fill it with: python3 tools/file_links.py add WORK_DIR
cmd = "python3 tools/file_links.py check $REINS_WORK_DIR"

[[preflight]]
name = "references"
# warn only (user 2026-11-09: A 先只报警): records whose further-information-reference is not the ledger's current one
cmd = "python3 tools/file_links.py refs $REINS_WORK_DIR"

[[preflight]]
name = "source_files"
# samples the files stage A will read (raw/<case>/): a PDF / JPEG named .tif, a multi-frame TIFF (stage A reads frame 0
# only) or another workflow's derivative next to its original fails the batch before any OCR is spent
# (charnwood-wp3-production-20261010-1: 1120 of 1515 cases crashed in stage A, 5 h of OCR wasted)
cmd = "python3 -m e2e_plan_extract.s1_inputs.sources check $REINS_WORK_DIR --sample 300"


# ReinsLite reins/stops.py (user 2026-11-04: 要开启中断后自动续跑): a batch paused because a process was killed (memory
# watchdog) restarts its last command by itself, as its owner, once RAM is back. run_local_qa.sh skips every step's
# finished output and paid answers are cached, so a restart redoes only what was lost (step 9 per plan since
# georef-plan_resume-20261104-3; releases before it redo step 9 from the start).
[resume]
after_kill = true
max = 3              # restarts per batch in 24 h; then it stays paused and asks a person
wait_min = 10        # minutes after the kill
mem_free_pct = 40    # RAM available before a restart

# ReinsLite C10 (user 2026-11-04: 两周被看门狗杀 11 次, 我不想再花时间管理这些): what each heavy process needs. reins holds
# (SIGSTOP) a matching process until its claim fits the machine budget, production before experiments. Numbers are
# starting points: reins measures every run and asks max(declared, 1.1 x measured peak) from then on.
[resources.ocr_rotated]
match = "s3_georef\\.ocr_rotated"
gpu_gb = 8                 # measured 2026-10 (two at once were killed)
mem_gb = 4
[resources.read_vlm]
match = "s3_georef\\.read_vlm"
gpu_gb = 10.5              # 10.2 GB at the 2026-11-03 kill
mem_gb = 3
[resources.georef]
match = "s3_georef\\.batch"
gpu_gb = 12                # the whole step 9: 0.70 x 16.3 GB + CUDA contexts; each shard holds 1/E2E_GPU_PROCS
split_env = "E2E_GPU_PROCS"
mem_gb = 10                # per shard: 9.6 GB RSS at the 2026-11-04 04:53 kill
[resources.yolo_plans]
match = "s2_extract/yolo_plans\\.py"
gpu_gb = 4
mem_gb = 4
[resources.stage_a]
match = "stage_a_batch\\.py"
gpu_gb = 4
mem_gb = 4
[resources.qwen_crops]
match = "s2_extract/vlm_crops\\.py"
gpu_gb = 12
mem_gb = 6
[resources.plot_seg]
match = "s3_trace/seg_trace\\.py"
gpu_gb = 4
mem_gb = 4
[resources.judge]
match = "s4_verify/qa_judge\\.py"
mem_gb = 11                # ~10-11 GB each with MALLOC_ARENA_MAX=2, up to 16 GB on big portal plans

[modules.prepare]
about = "预处理（第 0 步，页面分类之前的一切）：按文件头识别类型、展开多帧 TIFF、去掉旧流程派生件、去重、胶片夹分帧、负片反转、拼板拆页、逐 case 清单"
files = ["e2e_plan_extract/s1_inputs/sources.py", "legacy_produce/stage_a/batch_ocr.py",
         "e2e_plan_extract/s1_inputs/frames.py", "e2e_plan_extract/s1_inputs/vendor/scan_file_disassemble.py"]
tools = ["source_normalise", "frame_split"]

[modules.plan_crop]
about = "从扫描页挑出图纸页，裁出 site / location plan（第 1-5 步）"
files = ["e2e_plan_extract/s1_inputs/*", "e2e_plan_extract/s2_extract/*"]
prompts = ["crops", "verify", "pick", "plan_type", "slot"]
models = ["local_vlm"]
weights = ["txtdraw", "plan_notplan", "text_image", "multi_single", "panel_yolo", "plan_type_yolo", "plan_box_yolo", "qwen_vl", "doclayout_v3", "ppocr_det", "ppocr_rec", "plan_quality", "plot_seg", "plan_type"]
tools = ["stage_a_launcher", "page_gate", "panel_crop", "model_io", "vlm_cache", "vlm_crops", "crop_vetter"]

[modules.plan_crop.gate]
# 挑图模块自己的门禁（2026-10-19，ReinsLite 分模块门禁）：在 bench-plan-crops（99 个回归 case：两个位置、用户规则、裁图真值）
# 和 bench-plan-boxes（用户标的 294 页 + 9 个 council 398 页）上打分；本地模型、有缓存、不花钱，约 30 分钟，要 GPU 空闲。
# 硬指标：两个位置选对数、至少一张对的 case 数、真值页上完整框住数 / 切坏数、用户规则不新增失败。
cmd = "python3 $REINS_ADAPTER/gate.py MALLOC_ARENA_MAX=2 /env/venv/yolo/bin/python benchmark/s2_crops/module_gate.py"
benchmark = "bench-plan-crops"

[modules.georef]
about = "把图纸放到地图上：读路名、比例、门牌号，配准到 EPSG:27700（第 6-10 步）"
files = ["e2e_plan_extract/s3_georef/*"]
prompts = ["roads_scale"]
models = ["local_vlm"]
weights = ["minima_loftr", "qwen_vl", "ppocr_det", "ppocr_rec"]
tools = ["rotated_ocr", "scale_text", "read_vlm", "georef_batch", "plan_pose", "names_locate", "road_fit", "house_numbers",
         "minima_sliding", "geoplanagent_lib", "address_parser", "reliable_point", "os_http"]

[modules.trace]
about = "沿申请人画的红线描出多边形（第 11 步）"
files = ["e2e_plan_extract/s3_trace/*"]
prompts = ["locate", "house_number"]
models = ["local_vlm"]
weights = ["qwen_vl"]
tools = ["boundary_lab", "heavy_line", "fork_map"]

[modules.judge]
about = "两个模型对照图纸，判断交付的多边形对不对（第 14 步）"
files = ["e2e_plan_extract/s4_verify/qa_judge.py"]
prompts = ["judge", "boundary_check", "tree_judge", "tree_boundary_check", "local_screen"]
models = ["judge_primary", "judge_second", "judge_tiebreak"]
tools = ["judge_evidence"]

[modules.lanes]
about = "按各项判定把 case 分到自动放行 / 人工审核 / 退回（第 12、13、15 步）"
files = ["e2e_plan_extract/s4_verify/qa_input_polygon.py", "e2e_plan_extract/s4_verify/qa_final.py",
         "e2e_plan_extract/s4_verify/case_classify.py", "e2e_plan_extract/s4_verify/redline_agree.py",
         "e2e_plan_extract/s5_review/noplan_reader.py", "e2e_plan_extract/s5_review/noplan_model.json",
         "e2e_plan_extract/s5_review/team_workbook.py", "e2e_plan_extract/s5_review/pool_rates.json",
         "e2e_plan_extract/s5_review/polygon_rules/*"]
prompts = ["case_class", "noplan_read"]
models = ["case_class", "noplan_read"]
tools = ["case_classify", "rule_classifiers", "qa_input_polygon", "redline_agree", "qa_final", "noplan_reader", "team_workbook"]

[modules.redraw]
about = "DrawPolygon 机器出图：图纸上的红线圈经配准放到地图上、贴合 OS MasterMap 地块，得到每个 case 的机器多边形和置信档 A-D，与交付多边形并排（第 13 步，只作证据和修改建议，不改任何判定）"
files = ["e2e_plan_extract/s4_verify/redraw.py"]
tools = ["redraw"]

# [modules.review] retired 2026-11-19: the review page (server.py, index.html, db.py, queues.py) moved to web-app
# qa/review, reins module qa_review there (user: 全都应该放在web-app呀，这个和e2e没有关系)

[modules.fme_check]
about = "FmeCheck（第 15f 步，用户 2026-11-17：FME 检测做成单独的模块）：客户 FME 规则（Landmark Spatial Dashboard v3-8 的 SA / RM 规则）查每个 case 可能交付的每个多边形（交付的、DrawPolygon 的、GeoTextCheck 的），必须修的先自动修，修不了的交给人；交付命令的 FME 关卡用同一份规则"
files = ["e2e_plan_extract/fme/*", "docs/FME_GATE.md", "tests/test_fme.py", "tests/test_fme_stage.py", "benchmark/fme/*"]
tools = ["fme_rules"]

[modules.fme_check.gate]
# 规则改了要先过校准（不花钱，约 2 分钟）：bench-fme-landmark（Landmark 自己的 FME 工作簿，174 个、17 个 council）上
# 逐条规则比对，召回率不能比基准低 0.005 以上，必须修的规则精确率也一样（RM-07/08/09 依赖今天的客户输入，只显示不拦）；
# 单元测试先过。结果写 $REINS_GATE_OUT
cmd = "python3 -m pytest -q tests/test_fme.py tests/test_fme_stage.py && python3 $REINS_ADAPTER/gate.py python3 benchmark/fme/gate.py"
benchmark = "bench-fme-landmark"

[modules.pool1]
about = "pool1（用户 2026-11-19：做成独立模块）：空间包交付前的第一轮分池 correct / unsure / error / query。只读别的阶段的输出文件（plans.json、trace_AutoRef.tsv、redraw.csv、noplan_read.json、fme_check.csv 等），按包配置 pool1/councils/<包>.toml 里的有序规则出 lab/result.csv、detail.csv、layers.gpkg 和 xlsx；含输入准备（客户 JSON + 公司库快照 + mapping）和图纸红线圈形状证据；docs/POOL1.md"
files = ["e2e_plan_extract/pool1/*", "tests/test_pool1_*.py", "docs/POOL1.md"]

[modules.intake]
about = "intake（用户 2026-11-19：e2e 的专门子模块，从本地仓库 /env/code/intake 搬入）：客户给的输入在批次开始前备齐——S3 新清单监视（30 分钟）、每日客户文件登记、case 表和报告、intake 批次（取文件、清单画像、采集规则、映射、账本）；python3 -m e2e_plan_extract.intake；docs/INTAKE.md"
files = ["e2e_plan_extract/intake/*", "tests/test_intake*.py", "docs/INTAKE.md", "tools/install_intake_timers.sh",
