[review_source]
# where reviewers' verdicts live (ReinsLite reins/loop.py): imported hourly for recent production / rework batches;
# a case finished without a person (results good) that a reviewer marked wrong becomes an issue on the batch
databases = ["{work_dir}/lab/review/review.db", "/data/councils/{scope0}/review/**/review.db"]
table = "events"
where = "action = 'verdict'"
columns = { case = "case_id", reviewer = "reviewer", verdict = "verdict", error_type = "error_type", note = "note", at = "at" }
verdicts = { correct = "correct", error = "wrong", query = "unsure" }
case_pattern = "([0-9]+)$"
# client feedback (Landmark dashboards' Validcases, Queries, HMLR P/A/F samples) collected into the ledger nightly
commands = ["/home/rmsi/miniconda3/bin/python3 /env/code/ledger/feedback_events.py {scope0}"]
