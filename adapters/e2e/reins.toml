# ---- ML weights (ReinsLite C17): every model file the pipeline loads. reins hashes the file(s) -> weights-<name>-vN
# (same bytes = same version), harvests the training record beside them (ultralytics args.yaml / results.csv,
# the house trainer's history.json / metrics.json / train_manifest.csv) and refuses to start a production batch
# whose files are not a registered version (the silent model fallback of 2026-09). origin: trained = ours.
# Where the trained weights live besides this machine (ReinsLite weights_store): every registered version of an
# origin = "trained" entry is uploaded to the private HF repo; a new machine runs `reins weights pull --to DIR`.
[weights_store]
kind = "hf"
repo = "zhaojia/rmsi"
prefix = "e2e-plan-extract"
upload = ["trained"]
# one folder per kind of model, named for what it does; an improved model is the next vN/ in its folder
[weights_store.folders]
txtdraw = "page-doc-or-drawing"                # is the page a document or a drawing (v2 = the 3-seed SSD ensemble)
plan_notplan = "page-plan-or-not"              # is the page a land plan
text_image = "page-text-or-image"              # text page or image page
multi_single = "page-one-or-many-plans"        # one drawing on the page or several
panel_yolo = "drawing-panel-detector"          # boxes the drawing panels on a sheet (Braintree labels)
plan_box_yolo = "plan-box-detector"            # boxes every land plan on a page (plan-box spec)
plan_type_yolo = "site-location-plan-detector" # finds site / location plan boxes on pages without a caption
plot_seg = "plot-boundary-segmentation"        # draws the plot boundary on a plan (PLAN_MODE=yolo: ranks crops)
plan_quality = "plan-crop-quality"             # can the crop be placed on an OS map / is a site boundary marked
plan_type = "plan-crop-type"                   # floor / block / site / location / other plan

