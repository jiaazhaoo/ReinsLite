# ReinsLite settings of e2e-plan-extract, kept outside its repo (2026-11-19, user: e2e 是业务代码，不允许出现任何 reinslite).
# reins finds them by the repo path below, from the main checkout, a candidate worktree or a release tree. The glue
# that drives e2e from outside sits next to this file: stage_hook.py (stage boundaries + case ledger), gate.py (gates),
# runctl.py (intake runs, $E2E_RUN_CONTROL), container_claim.py, cloud_register.py; AGENTS.md says how to work.
project = "e2e-plan-extract"
repo = "/env/code/e2e-plan-extract"
case_key = "oachargeid"                   # this project's name for the case key column (reins reads it beside case_id)
# a case is these three together, in every workflow (user 2026-11-20: 一个case在我们这永远是3字段作为id,无论任何工作流和框架):
# batch open refuses a case set without them (make it with: python3 $REINS_ADAPTER/stage_hook.py cases EVAL_DIR > X.tsv)
case_key_fields = ["council", "oachargeid", "further_information_reference"]
case_id_pattern = "^[^\\s,]+$"            # the client's own oachargeid (Sheffield 75755, Mansfield 1986/0508/P, Powys
                                          # 202100;3031425170): no spaces or commas; the case is council + oachargeid + further-information-reference

[batch]
scope = ["council", "wp"]                 # batch names: <council>-<wp>-<type>-<YYYYMMDD>-<n>, e.g. sheffield-wp3-production-20261007-1

[glossary]
file = "/env/code/standards/glossary.toml"   # the project's one word list (all repos, user 2026-11-16); `reins lint` reads it with the framework's

[deliver]
forbid_scripts = ["cjk"]                  # client files are English only (reins deliver check refuses CJK text)

[dev]
repo = "/env/code/e2e-plan-extract"
push = "origin"                           # reins dev finish / release / the watchdog publish main + qa- tags to GitHub
# reins dev finish runs this in the candidate's worktree; gate.py hands the gate --out $REINS_GATE_OUT. Since 2026-10-26 (decision #42) the
# daily gate is bench-judge-hmlr-100 (4 councils, HMLR truth; benchmark/judge_hmlr/README.md); eval-359 (Sheffield) is an
# auxiliary line inside it; the qa359 gate stays for its pipeline tier ([dev.upstream])
# the project's word police first: a change that brings a forbidden word into a field name is refused (2026-11-16)
gate = "python3 $REINS_ADAPTER/no_reins.py && python3 /env/code/standards/vocab/check.py diff && python3 $REINS_ADAPTER/gate.py python3 benchmark/judge_hmlr/gate.py"
release_prefix = "qa"                     # tags qa-YYYYMMDD-N, trees e2e-plan-extract-rel-qa-YYYYMMDD-N (as before reins)
# e2e's history names no framework either (user 2026-11-19): merges and tags signed by the project, merge messages
# without the gate's evidence (kept in reins.db gate_log), and no candidate named or described with these words
merge_author = "e2e-plan-extract <e2e-plan-extract@users.noreply.github.com>"
merge_message = "short"
history_forbid = ["reins"]
# after reins dev release (in the new release tree): the GitHub release page, its models, smoke-expected.json -- what
# tools/update.sh on other machines needs to install it (user 2026-10-26: whoever clones the repo runs it on their own)
post_release = "python3 tools/release_publish.py --tag $REINS_RELEASE"
# tools/dev/dev.py is replaced by reins dev start / finish / release; only `dev.py list` still runs (read-only)
blocked_tools = ["tools/dev/dev.py"]

[dev.upstream]
# a change to these files can change every output after it: it needs the pipeline tier on an idle GPU (~1.5 h),
# or reins dev finish VERSION --skip-tier upstream --why '...' (recorded)
files = ["e2e_plan_extract/s1_inputs/*", "e2e_plan_extract/s2_extract/*", "e2e_plan_extract/s3_georef/*",
         "e2e_plan_extract/s3_trace/*", "e2e_plan_extract/resumable.py", "tools/run_local_qa.sh"]
gate = "python3 $REINS_ADAPTER/gate.py python3 benchmark/qa359/gate.py --tier pipeline"

[run]
# where a batch may work (/data/README.md, user 2026-10-22): reins batch open --work-dir /data/<council>/runs/{batch}
# ({batch} becomes the new batch id); anything else is refused
work_dirs = ["/data/councils/*/runs/{batch}", "/data/benchmarks/*/experiments/{batch}", "/data/lab/datasets/*/runs/{batch}",
             "/data/lab/projects/*/runs/{batch}"]
# shown on the board for every batch of this project
probe = "python3 /env/code/e2e-plan-extract/tools/qa_status.py {work_dir}"
# a session never runs these itself, also not through a wrapper script: only `reins run` starts them
programs = ["run_local_qa.sh", "run_rework.sh", "boundary_lab.py", "qa_judge.py", "case_classify.py", "noplan_reader.py",
            "vlm_crops.py", "vet_crops.py", "qa_input_polygon.py", "e2e_plan_extract.georef.batch",
            "e2e_plan_extract.georef.read_vlm", "e2e_plan_extract.georef.ocr_rotated",
            "e2e_plan_extract.s3_georef.batch", "e2e_plan_extract.s3_georef.read_vlm", "e2e_plan_extract.s3_georef.ocr_rotated"]
# tools/run_local_qa.sh reports these stages through $E2E_STAGE_HOOK (stage_hook.py here): open a batch with
#   --stage prepare --stage plan_crop=V --stage georef=V --stage trace=V --stage check=V:paid
# and start it with  reins run BATCH --self-staged -- tools/run_local_qa.sh EVAL_DIR
stages = ["prepare", "plan_crop", "georef", "trace", "check"]

# what a reins run gives e2e, in e2e's own words (it reads no reins variable): the run id, the stage hook, the module
# version of each stage (results_store keys reused outputs by it), the work dir, the container's resource claim, and
# run control for the intake runs a run may start
[run.env]
E2E_RUN_ID = "{batch}"
E2E_WORK_DIR = "{work_dir}"
E2E_STAGE_VERSIONS = "{stage_versions}"
E2E_STAGE_HOOK = "python3 {adapter}/stage_hook.py"
E2E_CONTAINER_HOOK = "python3 {adapter}/container_claim.py"
E2E_RUN_CONTROL = "python3 {adapter}/runctl.py"


[results]
# the production page (reins board, /production): what each case ended as, read from the batch's own work dir.
# a case's result is its newest batch's row; the rows of cases outside the batch are left out
file = "lab/qa_final.csv"                 # step 15 output, relative to the batch work_dir
key = "case"                              # SHF_100047 / CHA_168849 / MAN_710313
key_pattern = "([0-9]+)$"                 # the case id inside it
value = "lane"
detail = "review_category"                # the breakdown of a value
good = ["auto pass"]                      # finished without a person


# what each case was delivered as (the board's batch comparison): the status column (the code's group) of the delivery
# workbooks (s5_review/delivery_workbook.py, user 2026-10-23); a case's status is the one in the newest workbook
[results.delivered]
files = ["/data/councils/*/runs/*/delivery/*_spatial_autoQA_*.xlsx"]
sheet = "Conclusion"
keys = ["oachargeid"]                                 # the first column of these whose values are this batch's cases
value = "status"
name = "^(.*?)_spatial_autoQA_"                       # the batch name: the file name before this
# statuses since delivery codes v2 (2026-11-03): the Summary categories; the older workbooks' groups stay readable
good = ["High Confidence", "Correct"]
order = ["High Confidence", "Likely Error", "Uncertain", "Query - Hard to find polygons",
         "Query - Plan address & input address conflicts", "Query - No Scans",
         "Query - No Polygons found based on the input address",
         "Correct", "LikelyError", "Query", "NoPlan", "NoScan"]
bad = ["Likely Error", "LikelyError"]

# the four fields the batch comparison shows; every status falls in one
[results.delivered.groups]
Correct = ["Correct"]
Error = ["LikelyError"]
"No plan" = ["NoPlan", "NoScan"]
Query = ["Uncertain", "Query"]

# why a case could not be processed: a skip / fail reason -> one of these words (first match wins; else "other")
[[results.reasons]]
match = "no scans|no source files|never entered|gave no page"
zh = "没有扫描件"
en = "No scans"
[[results.reasons]]
match = "no plan_image|no drawing page"
zh = "扫描件里没找到图纸"
en = "No plan in the scans"
[[results.reasons]]
match = "no answer from|no lane"
zh = "AI 核对没做完"
en = "AI check not finished"
[[results.reasons]]
match = "no georef|no OCR|no ring|no trace|trace error|no address"
zh = "地图上没定到位置"
en = "Not placed on the map"
[[results.reasons]]
match = "stage A"
zh = "挑图出错"
en = "Plan picking failed"

