# systemd --user drop-in for e2e's intake units (intake-watch.service, intake-register.service): every intake run they
# start is a reins batch, notes go to the board. Installed by adapters/e2e/install_timers.sh.
[Service]
Environment="E2E_RUN_CONTROL=python3 /env/code/ReinsLite/adapters/e2e/runctl.py"
