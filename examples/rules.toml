# C7b routing rules as data. `reins rules list` prints them in plain words; every change ships with
# `reins rules diff OLD_LANES.csv NEW_LANES.csv` (which cases moved lane).

[[rule]]
id = "no_source_page_never_auto_accept"
lane = "review"
when = "a field has no page it was read from"
evidence = "bench-demo-v3: 41 forms had been auto-accepted with a field taken from the wrong form"
decided = "2026-01-15"
by = "lead reviewer"
cost_per_case_usd = 0.0

[[rule]]
id = "checker_veto"
lane = "review"
when = "the checker model says a field is wrong; no other signal may overrule it"
evidence = "bench-demo-v4: overruling the checker let 2 wrong forms through (n=40 wrong forms)"
decided = "2026-01-20"
by = "lead reviewer"
cost_per_case_usd = 0.01
