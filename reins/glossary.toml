# C0 glossary, framework level: one word, one meaning, for the words every ReinsLite project shares. A project adds its
# own domain words in its repo (reins.toml: [glossary] file = "glossary.toml"); `reins lint` reads both, and a project
# term with the same name replaces the framework's (to give it the project's values).
#
#   term        canonical English word (what code and headers use)
#   zh          Chinese gloss, for reading only
#   values      allowed values, when the term is an enum
#   forbidden   synonyms that must not be used. A plain entry matches as a word anywhere in an identifier
#               ("qa" hits "qa_final"); an entry starting with "=" matches only the whole identifier
#               ("=confidence" hits "confidence" but not "trace_confidence").
#
# Changing a definition = a new term + `retired = "<date>: <why>"` on the old one. Never edit a meaning in place.
# `version` bumps whenever a term is added or retired; tables and docs linted against a version record which one.
# v2 (2026-10-08): project-neutral. The first project's words (oachargeid, plan_image, georef, work_package, ...)
# moved to that project's own glossary; case_id and scope added.

version = 2

[[term]]
term = "case"
zh = "案件"
definition = "The unit a pipeline processes and a person can check: one record of the project's domain. Every record is keyed by its case_id."

[[term]]
term = "case_id"
zh = "案件主键"
definition = "The case key, stored exactly as received. A project names its own column for it (reins.toml case_key) and gives its pattern (case_id_pattern); reins reads either name."
forbidden = ["=case_key_value", "=item_id"]

[[term]]
term = "scope"
zh = "批次范围"
definition = "What a batch covers: 1-4 parts joined by '-', named by the project (reins.toml [batch] scope, e.g. client-package). The first part of a batch name."

[[term]]
term = "check"
zh = "自动检查"
definition = "An automated test of one output of one case. Produces a verdict."
forbidden = ["qa"]

[[term]]
term = "verdict"
zh = "自动判定"
definition = "What automated checks concluded about one output."
values = ["correct", "wrong", "unsure"]
forbidden = ["=pass", "=passed", "=fail", "=judgement"]

[[term]]
term = "lane"
zh = "去向"
definition = "Where the router sends a case after its verdicts."
values = ["auto_accept", "review", "auto_reject", "cannot_verify"]
forbidden = ["=category", "=queue", "=auto_pass"]

[[term]]
term = "review"
zh = "人工审核"
definition = "A human looks at a case. Only ever human; a model is never a reviewer."

[[term]]
term = "customer_result"
zh = "客户质检结果"
definition = "The customer's own QC result for a case. Can be wrong; not a golden. A project lists its values in its glossary."
forbidden = ["=qc_result"]

[[term]]
term = "golden"
zh = "人工裁定标签"
definition = "A label a human confirmed on the review page, with who, when and whether the source evidence was seen. The highest-trust label."
forbidden = ["truth", "=gt", "=gold", "=ground_truth", "=standard_answer"]

[[term]]
term = "reference"
zh = "参考数据"
definition = "Data from an earlier delivery or the customer's input, used as a label of the lowest trust (benchmark source reference or reference_<kind>). Not a golden."

[[term]]
term = "confidence"
zh = "置信度"
definition = "Never used alone. Always <stage>_confidence, and the glossary entry for that stage says whether it is a calibrated probability or a band."
forbidden = ["=confidence", "=cfd", "=high", "=medium", "=low"]

[[term]]
term = "batch"
zh = "批次"
definition = "One registered execution of planned stages over a fixed case set for one purpose (C3). Named <scope>-<type>-<YYYYMMDD>-<n>."
forbidden = ["=run", "=run_id", "=eval_dir"]

[[term]]
term = "eval"
zh = "评测批次"
definition = "A batch type: running a pipeline on a benchmark to measure it."

[[term]]
term = "attempt"
zh = "续跑"
definition = "One start of a batch's processes; a resume after a crash is a new attempt of the same batch."

[[term]]
term = "stage"
zh = "阶段"
definition = "One step of a workflow, run by one module; the unit the case ledger counts."
forbidden = ["=phase"]

[[term]]
term = "module"
zh = "子模块"
definition = "A replaceable part of a pipeline, registered once, globally unique name."

[[term]]
term = "module_version"
zh = "子模块版本"
definition = "<module>-<suffix>-<YYYYMMDD>-<n>, n from 1 per module per day. Pins code, prompts, models, weights, tools."
forbidden = ["=version", "=v"]

[[term]]
term = "release"
zh = "发布"
definition = "A named set of module versions that production batches run."

[[term]]
term = "workflow"
zh = "工作流"
definition = "The ordered stages of a pipeline with what each uses; frozen as workflow-<name>-vN."

[[term]]
term = "tool"
zh = "工具"
definition = "What a stage picks up besides models and prompts: code, an external API, a data file. Versioned as tool-<name>-vN."

[[term]]
term = "weights"
zh = "模型权重"
definition = "The files of a machine-learning model a stage loads; versioned by content as weights-<name>-vN, with the training record."

[[term]]
term = "benchmark"
zh = "基准集"
definition = "A frozen, versioned case set with inputs, per-stage outputs and labels (C4). Named bench-<name>-vN."
forbidden = ["=eval_set", "=testset", "=test_set"]

[[term]]
term = "threshold"
zh = "阈值"
definition = "A decision value on a score. Always recorded with the sample size and split it was set on."

[[term]]
term = "time_limit"
zh = "时间上限"
definition = "Wall-clock limit for one item or step."
forbidden = ["=timeout_budget", "=truncation"]

[[term]]
term = "spend_cap"
zh = "花费上限"
definition = "The most a batch, stage or case may spend (USD). Set by the user."
forbidden = ["=cap", "=budget"]

[[term]]
term = "provider"
zh = "服务商"
definition = "A metered service the gateway fronts (reins/providers.py presets + config.toml)."

[[term]]
term = "balance"
zh = "账户余额"
definition = "Money left on a provider account."

[[term]]
term = "key_limit"
zh = "密钥限额"
definition = "A provider-side spending limit on one API key (e.g. weekly)."

[[term]]
term = "missed_error"
zh = "漏放"
definition = "A case in lane auto_accept whose output is actually wrong. The primary metric; must not increase."
forbidden = ["=miss", "=leak", "=leaked_fail"]

[[term]]
term = "review_load"
zh = "审核量"
definition = "Number of cases sent to review. A cost, not an error."
